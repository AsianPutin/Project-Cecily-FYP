name: Android Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-cecily-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.3.1
          name: Project Cecily - Academic Release v1.3.1
          body: |
            ## Project Cecily: Utility-First Long-Distance Relationship Companion System
            **Academic Release v1.3.1 — Final System Build**

            ### 🎯 Core Objectives & Implemented Features

            #### 1. Quick & Easy Pairing and Real-Time Synchronization
            - **6-Digit Token Handshake Protocol:** Enables secure, bi-directional 1-to-1 device linking via a unique 6-digit verification token (`AccountActivity`).
            - **Cloud Synchronization:** Real-time data persistence using Firebase Realtime Database with automated user scoping, phone authentication, and duplicate account protection.

            #### 2. In-App Flight Telemetry & Travel Monitoring
            - **Real-Time Flight Tracking:** Automated background travel monitoring framework processing IATA flight codes via AviationStack API with multi-key failover and quota management (`FlightTrackerActivity`).
            - **Interactive Flight Map & Trajectory:** Live flight simulation displaying departure/arrival progress, plane orientation, and dotted trajectory polyline (`FlightMapActivity`).
            - **Automated Timezone Engine:** Intelligently collapses dual clocks into a single centered clock when partners share the same time zone, or calculates relative time offsets when separated.

            #### 3. Integrated Lifestyle & Wishlist Hub
            - **Surprise-Preserving Shared Wishlist:** Centralized lifestyle wishlist with post-purchase privacy shielding, secret gift rules, and ViewPager2 horizontal gesture navigation (`WishlistActivity`).
            - **Ephemeral Photo Cycle Stream:** Shared 24-hour photo cycle hub with squircle card cropping (`SquircleOverlayView`), 1080x1080 high-res camera/gallery processing, and developer multi-photo management (`PhotoCycleActivity`).

            #### 4. Preference-Shielded Decision Helper (Consensus Swiper)
            - **Weighted Decision Engine:** Tinder-style gesture-driven swiping framework (`SwipeActivity`) with **Together Mode** (local food, dining, and activities) and an expanded **31-Card LDR Mode Deck** (Co-Op video games, watch parties, virtual dates, and co-working sessions).
            - **Mutual Match Resolution:** Automated overlap detection with silent match deletion, red **X** action buttons, and individual swipe preference resetting.

            #### 5. Dynamic Ambient Desktop Widgets & Location Safety
            - **Passive Ambient Awareness:** Three native Android home-screen desktop AppWidgets:
              1. *LDR Distance & Time Widget* (`LdrStatusWidgetProvider`): Live distance calculation and time difference indicator with Together Mode adaptation.
              2. *Quick Poke Widget* (`PokeWidgetProvider`): One-touch haptic notification pings.
              3. *Photo Cycle Widget* (`PhotoCycleWidgetProvider`): Auto-cycling 24-hour photo stream directly on the launcher.
            - **Real-Time Location & Gesture Controls:** OSMDroid OpenStreetMap location tracking (`TrackingActivity`) with edge-clamped partner tracking and continuous one-handed double-tap drag zoom gesture controls (`OneHandedZoomGestureHelper`).

            ---
            *Built with Android Native SDK (Java, API 35) & Firebase.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
