name: Android Build & Distribute

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to Firebase App Distribution
        # Note: This will fail until FIREBASE_APP_DISTRIBUTION_CREDENTIALS or GITHUB_TOKEN with appropriate setup is added
        # For now, we'll keep the build artifact as a fallback
        run: ./gradlew appDistributionUploadDebug
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.CREDENTIAL_FILE }}

      - name: Upload APK Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: project-cecily-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
