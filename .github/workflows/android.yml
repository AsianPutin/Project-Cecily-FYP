name: Android Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-cecily-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.3.0
          name: Project Cecily - Release v1.3.0
          body: |
            ### 💖 Project Cecily - Release v1.3.0

            #### 🌟 Highlights & Features Included:
            - **Expanded 31-Card LDR Swipe Deck:** Expanded long-distance date deck covering Co-Op Games, Casual Party Games, Watch Parties, Horror Docuseries, Cooking Together, PowerPoint Nights, Gift Unboxings, Bedtime Webtoons, and Virtual Dates.
            - **Photo Cycle Squircle Crop Engine:** Updated photo crop overlay with squircle card mask (`SquircleOverlayView`) matching dashboard photo card proportions (`20dp` corner radius) and updated labels (*"Crop Photo"*, *"Drag and pinch to fit your photo in the frame"*, *"Save Photo"*).
            - **Red X & Swipe-to-Delete Mutual Matches:** Added bright red **X** icons and smooth left/right swipe-to-delete gesture removal in Mutual Date Matches with automatic silent Firebase preference resetting.
            - **One-Handed Double-Tap Drag Map Zoom:** Added continuous quick-scale gesture (`OneHandedZoomGestureHelper`) to Partner Location Tracker and Flight Tracker maps (double-tap & hold drag DOWN to zoom in, UP to zoom out).
            - **Same-Timezone Single Clock Collapse:** Intelligently collapses dual clocks into a single centered clock when both partners are in the same time zone (0 hrs GMT difference).
            - **Calibrated Launcher Icons & Build Stability:** 100% mathematically centered launcher icons (+7px horizontal precision calibration) and single default app icon architecture.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
